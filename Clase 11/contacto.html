<!DOCTYPE html>
<html lang="es-PE">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moda Perú</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="encabezado2">
        <h2>Contactos</h2>
    </div>
    <div class="grop-contactos">
        <form>
            <label for="nombre">Nombre</label>
            <input type="text" name="nombre" id="nombre" required placeholder="Escribe tu nombre">
            <label for="email">Correo Electrónico</label>
            <input type="email" name="email" id="email" required placeholder="Escribe tu correo electrónico">
            <label for="telefono">Teléfono</label>
            <input
                type="tel"
                name="telefono"
                id="telefono"
                placeholder="Escribe tu número telefónico"
            >

            <label for="comentario">Comentario</label>
            <textarea
                name="comentario"
                id="comentario"
                placeholder="Indícanos un comentario del producto"
            ></textarea>

            <button type="submit">Enviar</button>
        </form>
    </div>
</body>
</html>
